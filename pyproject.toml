[project]
name = "cdl-ftw-zarr-marimo"
version = "0.1.0"
description = "USDA Cropland Data Layer x Fields of the World: Zarr/icechunk read with xarray, drawn as tiles in lonboard under marimo; the per-field parquet joins as DuckDB SQL in a second notebook"
requires-python = ">=3.13"
dependencies = [
    "marimo==0.24.0",
    "xarray",
    "zarr>=3",
    "icechunk",
    "obstore",
    "pyarrow>=25.0.0",
    "numpy",
    "anywidget>=0.9",
    "lonboard>=0.16.0,<0.17",
    "arro3-core",
    "pillow==12.3.0",
    "morecantile==7.0.3",
    "ipywidgets==8.1.8",
    "traitlets==5.15.1",
    "scipy",
]

[dependency-groups]
dev = ["playwright"]
